<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Boule à Drapeaux</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /*---- Reset & Base ----*/
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #f5f5f5;
      background: linear-gradient(135deg, #212335 0%, #13141b 100%);
      min-height: 100vh;
      box-sizing: border-box;
    }
    a {
      color: inherit;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 5px;
      transition: background 0.2s;
    }
    a.active, a:hover {
      background: rgba(44,55,114,0.15);
    }
    header {
      padding: 0 0 20px 0;
      background: rgba(35,38,64,0.7);
      box-shadow: 0 2px 8px rgba(26,28,44,0.1);
      position: relative;
      z-index: 2;
    }
    nav {
      display: flex;
      gap: 10px;
      max-width: 800px;
      margin: 0 auto;
      padding: 12px 0;
      justify-content: center;
    }
    @media (max-width: 480px) {
      header { font-size: 16px; }
      nav { flex-direction: column; align-items: center; }
    }

    /*---- Main Layout ----*/
    main {
      min-height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      margin-top: 15px;
    }

    /*---- Game Area ----*/
    .game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100vw;
      margin-bottom: 24px;
    }

    /*---- Boule ----*/
    .boule-container {
      position: relative;
      width: 340px;
      height: 340px;
      margin: 28px auto 16px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (max-width: 480px) {
      .boule-container { width: 94vw; height: 94vw; max-width: 360px; max-height: 360px; }
    }
    .boule {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      box-shadow: 0 0 40px 4px #82a7e9bb, 0 0 0 7px rgba(255,255,255,0.07) inset;
      border: 2px solid rgba(190, 190, 230, 0.06);
      overflow: hidden;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /*---- Hole ----*/
    .hole {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 62px;
      height: 30px;
      background: #101217;
      border-radius: 50% 50% 50% 50% / 80% 80% 26% 26%;
      box-shadow: 0 4px 14px 2px #000a;
      z-index: 2;
      border: 2px solid #14161b;
    }

    /*---- Flags in boule ----*/
    .flags-inside {
      position: absolute;
      width: 90%;
      height: 90%;
      left: 5%;
      top: 5%;
      pointer-events: none;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      /* Slight blur for depth */
      filter: blur(0.2px) drop-shadow(0 0 1px #515d7c33);
    }
    .flag {
      width: 40px;
      height: 40px;
      margin: 3px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #e2e7fb55;
      box-shadow: 0 2px 7px #1b223a23;
      overflow: hidden;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /*---- Animated Falling Flag ----*/
    .falling-flag {
      position: absolute;
      left: 50%;
      top: 36px; /* Position just under the hole */
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 16px #41508c77;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      animation: fall-and-fade 0.5s cubic-bezier(0.52, 1.56, 0.3, 1) forwards;
      transform: translateX(-50%) scale(1.10);
    }
    @keyframes fall-and-fade {
      0% { top: 36px; opacity: 1; }
      70% { opacity: 0.92; }
      90% { opacity: 0.85; }
      98% { opacity: 0.55; }
      100% { top: 370px; opacity: 0; }
    }
    .falling-flag img { width: 48px; height: 48px; border-radius: 50%; }

    /*---- Buttons ----*/
    .buttons {
      margin: 12px 0 0 0;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 10px 24px;
      font-size: 1.1em;
      background: linear-gradient(135deg, #558be3 20%, #20349C 100%);
      color: #fff;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 2px 7px #131b2c32;
      font-weight: 600;
      margin-bottom: 6px;
      transition: background 0.15s, transform 0.12s;
    }
    button:hover, button:focus {
      background: linear-gradient(135deg, #729df5 0%, #4467b3 100%);
      transform: translateY(-2px) scale(1.03);
    }

    /*---- Gagnant ----*/
    .winner-msg {
      margin-top: 18px;
      font-size: 1.7em;
      font-weight: bold;
      color: #fcf8ec;
      text-shadow: 0 2px 18px #518a33c0, 0 0px 1px #233;
      animation: winner-anim 1.35s cubic-bezier(0.36,1.51,0.48,0.87);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 56px;
      justify-content: center;
    }
    @keyframes winner-anim {
      0% { opacity: 0; transform: scale(0.7);}
      10% { opacity: 1; }
      85% {  opacity: 1; }
      100% { opacity: 1; transform: scale(1.15);}
    }

    /*---- Responsive ----*/
    @media (max-width: 480px) {
      .boule-container { width: 99vw; height: 99vw; }
      .boule { width: 99vw; height: 99vw; }
      .flags-inside { width: 99%; height: 99%; }
      .winner-msg { font-size: 1.1em; }
      .buttons button { font-size: 1em; }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="#" class="active">Accueil</a>
      <a href="#">Boule à Drapeaux</a>
      <a href="#" style="opacity:0.7;pointer-events:none;">Ludo <span style="font-size:0.7em;">(Bientôt disponible)</span></a>
    </nav>
  </header>
  <main>
    <div class="container">
      <h1 style="font-size:2.2em;text-shadow:0 0 14px #223;"><span style="color:#6ec5ff;">🌍</span> Boule à Drapeaux</h1>
      <div class="game-area">
        <div class="boule-container">
          <div class="hole"></div>
          <div class="boule">
            <div class="flags-inside" id="flags-inside"></div>
          </div>
          <div id="falling-flag"></div>
        </div>
        <div class="buttons">
          <button id="shake-btn">Secouer la boule</button>
          <button id="restart-btn">Recommencer</button>
        </div>
        <div class="winner-msg" id="winner-msg" style="display:none;"></div>
      </div>
    </div>
  </main>
  <script>
    // ================================
    // Tableau de 195 codes ISO2 pays :
    // ================================
    // ISO2 codes, alpha, minuscule
    // (Tu peux les éditer ou compléter si besoin)
    const countries = [
      "af","al","dz","as","ad","ao","ai","aq","ag","ar","am","aw","au","at","az",
      "bs","bh","bd","bb","by","be","bz","bj","bm","bt","bo","ba","bw","br","bn",
      "bg","bf","bi","kh","cm","ca","cv","cf","td","cl","cn","co","km","cd","cg",
      "cr","ci","hr","cu","cy","cz","dk","dj","dm","do","ec","eg","sv","gq","er",
      "ee","sz","et","fj","fi","fr","gf","pf","ga","gm","ge","de","gh","gr","gd",
      "gp","gu","gt","gn","gw","gy","ht","hn","hu","is","in","id","ir","iq","ie",
      "il","it","jm","jp","jo","kz","ke","ki","kw","kg","la","lv","lb","ls","lr",
      "ly","li","lt","lu","mg","mw","my","mv","ml","mt","mh","mq","mr","mu","yt",
      "mx","fm","md","mc","mn","me","ms","ma","mz","mm","na","nr","np","nl","nc",
      "nz","ni","ne","ng","nu","nf","mk","mp","no","om","pk","pw","ps","pa","pg",
      "py","pe","ph","pl","pt","pr","qa","ro","ru","rw","re","bl","sh","kn","lc",
      "mf","pm","vc","ws","sm","st","sa","sn","rs","sc","sl","sg","sx","sk","si",
      "sb","so","za","kr","ss","es","lk","sd","sr","se","ch","sy","tw","tj","tz",
      "th","tl","tg","to","tt","tn","tr","tm","tc","tv","ug","ua","ae","gb","us",
      "uy","uz","vu","va","ve","vn","vg","vi","ye","zm","zw"
    ];

    // Mapping ISO2 -> nom de pays (français en version courte si possible) :
    // (ici, pour la démo, nom + drapeau pour 20 pays puis ... ; pour la prod, tu peux compléter le mapping)
    const countryNames = {
      af: "Afghanistan", al: "Albanie", dz: "Algérie", as: "Samoa am.", ad: "Andorre", ao: "Angola", ai: "Anguilla",
      aq: "Antarctique", ag: "Antigua-et-Barbuda", ar: "Argentine", am: "Arménie", aw: "Aruba", au: "Australie",
      at: "Autriche", az: "Azerbaïdjan", bs: "Bahamas", bh: "Bahreïn", bd: "Bangladesh", bb: "Barbade", by: "Biélorussie",
      be: "Belgique", bz: "Belize", bj: "Bénin", bm: "Bermudes", bt: "Bhoutan", bo: "Bolivie", ba: "Bosnie-Herzégovine",
      bw: "Botswana", br: "Brésil", bn: "Brunei", bg: "Bulgarie", bf: "Burkina Faso", bi: "Burundi", kh: "Cambodge",
      cm: "Cameroun", ca: "Canada", cv: "Cap-Vert", cf: "Centrafric.", td: "Tchad", cl: "Chili", cn: "Chine",
      co: "Colombie", km: "Comores", cd: "RD Congo", cg: "Congo", cr: "Costa Rica", ci: "Côte d'Ivoire",
      hr: "Croatie", cu: "Cuba", cy: "Chypre", cz: "Tchéquie", dk: "Danemark", dj: "Djibouti", dm: "Dominique",
      do: "République dominicaine", ec: "Équateur", eg: "Égypte", sv: "Salvador", gq: "Guinée équat.", er: "Érythrée",
      ee: "Estonie", sz: "Eswatini", et: "Éthiopie", fj: "Fidji", fi: "Finlande", fr: "France", gf: "Guyane fr.", 
      pf: "Polynésie fr.", ga: "Gabon", gm: "Gambie", ge: "Géorgie", de: "Allemagne", gh: "Ghana", gr: "Grèce",
      gd: "Grenade", gp: "Guadeloupe", gu: "Guam", gt: "Guatemala", gn: "Guinée", gw: "Guinée-Bissau",
      gy: "Guyana", ht: "Haïti", hn: "Honduras", hu: "Hongrie", is: "Islande", in: "Inde", id: "Indonésie",
      ir: "Iran", iq: "Irak", ie: "Irlande", il: "Israël", it: "Italie", jm: "Jamaïque", jp: "Japon",
      jo: "Jordanie", kz: "Kazakhstan", ke: "Kenya", ki: "Kiribati", kw: "Koweït", kg: "Kirghizistan",
      la: "Laos", lv: "Lettonie", lb: "Liban", ls: "Lesotho", lr: "Libéria", ly: "Libye", li: "Liechtenstein",
      lt: "Lituanie", lu: "Luxembourg", mg: "Madagascar", mw: "Malawi", my: "Malaisie", mv: "Maldives",
      ml: "Mali", mt: "Malte", mh: "Îles Marshall", mq: "Martinique", mr: "Mauritanie", mu: "Maurice",
      yt: "Mayotte", mx: "Mexique", fm: "Micronésie", md: "Moldavie", mc: "Monaco", mn: "Mongolie",
      me: "Monténégro", ms: "Montserrat", ma: "Maroc", mz: "Mozambique", mm: "Myanmar", na: "Namibie",
      nr: "Nauru", np: "Népal", nl: "Pays-Bas", nc: "Nouvelle-Calédonie", nz: "Nouvelle-Zélande", ni: "Nicaragua",
      ne: "Niger", ng: "Nigéria", nu: "Niue", nf: "Île Norfolk", mk: "Macéd. N.", mp: "Îles Mariannes N.",
      no: "Norvège", om: "Oman", pk: "Pakistan", pw: "Palaos", ps: "Palestine", pa: "Panama", pg: "Papouasie-Nouvelle-Guinée",
      py: "Paraguay", pe: "Pérou", ph: "Philippines", pl: "Pologne", pt: "Portugal", pr: "Porto Rico", qa: "Qatar", 
      ro: "Roumanie", ru: "Russie", rw: "Rwanda", re: "Réunion", bl: "Saint-Barthélemy", sh: "Sainte-Hélène",
      kn: "Saint-Kitts-et-Nevis", lc: "Sainte-Lucie", mf: "Saint-Martin", pm: "Saint-Pierre-et-Miquelon", 
      vc: "Saint-Vincent-et-les-Grenadines", ws: "Samoa", sm: "Saint-Marin", st: "Sao Tomé-et-Principe", 
      sa: "Arabie saou." , sn: "Sénégal", rs: "Serbie", sc: "Seychelles", sl: "Sierra Leone", sg: "Singapour",
      sx: "Saint-Martin (Pays-Bas)", sk: "Slovaquie", si: "Slovénie", sb: "Îles Salomon", so: "Somalie", 
      za: "Afrique du Sud", kr: "Corée du Sud", ss: "Soudan du Sud", es: "Espagne", lk: "Sri Lanka", sd: "Soudan", 
      sr: "Suriname", se: "Suède", ch: "Suisse", sy: "Syrie", tw: "Taïwan", tj: "Tadjikistan", tz: "Tanzanie", 
      th: "Thaïlande", tl: "Timor oriental", tg: "Togo", to: "Tonga", tt: "Trinité-et-Tobago", tn: "Tunisie", 
      tr: "Turquie", tm: "Turkménistan", tc: "Îles Turques-et-Caïques", tv: "Tuvalu", ug: "Ouganda", ua: "Ukraine", 
      ae: "Émirats arabes unis", gb: "Royaume-Uni", us: "États-Unis", uy: "Uruguay", uz: "Ouzbékistan", vu: "Vanuatu", 
      va: "Vatican", ve: "Venezuela", vn: "Vietnam", vg: "Îles Vierges (RU)", vi: "Îles Vierges (US)", ye: "Yémen", 
      zm: "Zambie", zw: "Zimbabwe"
    };

    // Utilitaires pour les noms
    function getCountryName(code) {
      return countryNames[code] || code.toUpperCase();
    }

    // Etat du jeu
    let shuffledCountries = [];
    let remainingCountries = [];
    let isAnimating = false;
    let winnerAnnounced = false;

    // Sélecteurs DOM
    const boule = document.querySelector(".boule");
    const flagsInside = document.getElementById("flags-inside");
    const fallingFlagDiv = document.getElementById("falling-flag");
    const winnerMsg = document.getElementById("winner-msg");
    const shakeBtn = document.getElementById("shake-btn");
    const restartBtn = document.getElementById("restart-btn");

    // Initialisation du jeu
    function shuffle(array) {
      // Fisher Yates
      for (let i=array.length-1; i>0; i--) {
        let j = Math.floor(Math.random() * (i+1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function resetGame() {
      shuffledCountries = shuffle(countries.slice());
      remainingCountries = shuffledCountries.slice();
      isAnimating = false;
      winnerAnnounced = false;
      showFlagsInside();
      winnerMsg.style.display = "none";
      winnerMsg.innerHTML = "";
      fallingFlagDiv.innerHTML = "";
      shakeBtn.disabled = false;
      shakeBtn.innerText = "Secouer la boule";
    }

    function showFlagsInside() {
      // Affiche tous les drapeaux restants dans la boule, disposés "aléatoirement"
      let html = '';
      for (let code of remainingCountries) {
        html += `
          <div class="flag">
            <img src="https://flagcdn.com/64x64/${code}.png" width="40" height="40" alt="${getCountryName(code)}" loading="lazy" />
          </div>
        `;
      }
      flagsInside.innerHTML = html;
    }

    function shakeBoule() {
      if(isAnimating || remainingCountries.length === 0) return;

      if(remainingCountries.length === 1) {
        announceWinner(remainingCountries[0]);
        return;
      }
      isAnimating = true;
      
      // Sélectionner un drapeau au hasard
      const idx = Math.floor(Math.random() * remainingCountries.length);
      const code = remainingCountries[idx];
      const name = getCountryName(code);      
      // Retire ce pays du tirage
      remainingCountries.splice(idx,1);

      // Animation : drapeau qui tombe depuis le trou
      let flagFallHtml = `
        <div class="falling-flag" title="${name}">
          <img src="https://flagcdn.com/64x64/${code}.png" alt="${name}" />
        </div>
      `;
      fallingFlagDiv.innerHTML = flagFallHtml;

      // Actualise la boule sans ce drapeau
      showFlagsInside();

      // Efface le drapeau animé après 0.5s (l'animation CSS dure 0.5s)
      setTimeout(()=>{
        fallingFlagDiv.innerHTML = "";
        isAnimating = false;
        // Si c'était l'avant-dernier drapeau, déclencher le gagnant à la secousse suivante
        if(remainingCountries.length === 1) {
          shakeBtn.innerText = "Voir le gagnant";
        }
        // Si plus aucun drapeau (impossible normalement)...
        if(remainingCountries.length <= 0) {
          shakeBtn.disabled = true;
        }
      }, 530);
    }

    function announceWinner(code) {
      if(winnerAnnounced) return;
      winnerAnnounced = true;
      shakeBtn.disabled = true;
      // Animation du gagnant : il s'affiche en grand sous la boule
      const flagURL = `https://flagcdn.com/64x64/${code}.png`;
      const name = getCountryName(code);
      winnerMsg.innerHTML = `🎉 Gagnant : <img src="${flagURL}" style="vertical-align:middle;width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid #ebebeb;margin:0 7px 0 7px;box-shadow:0 0 14px #4ea02a88;"> <span>${name}</span>`;
      winnerMsg.style.display = "flex";
      showFlagsInside(); // Montre le dernier drapeau dans la boule
    }

    // Boutons
    shakeBtn.addEventListener("click", function() {
      if(isAnimating) return;
      if(remainingCountries.length > 1) {
        shakeBoule();
      } else if(remainingCountries.length === 1) {
        announceWinner(remainingCountries[0]);
      }
    });
    restartBtn.addEventListener("click",resetGame);

    // Démarrage auto
    resetGame();

    // Accessibilité : touche Entrée sur le bouton Secouer 
    shakeBtn.addEventListener("keyup", function(e){
      if(e.key==="Enter"||e.key===" "){ shakeBtn.click(); }
    });

    // Optionnel : scroll centré sur boule sur mobile
    // window.onload = ()=>{document.querySelector(".boule-container").scrollIntoView({block:"center"})};
  </script>
</body>
</html>
